# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    # Root only. pnpm resolves every workspace member from pnpm-workspace.yaml,
    # so '/' already covers apps/* and packages/* — listing those globs as well
    # made Dependabot scan each package twice and open duplicate PRs per bump.
    # Root is also the only entry that sees the `catalog:` block and the root
    # devDependencies, so dropping it would leave those unmonitored.
    directories:
      - '/'
    schedule:
      interval: 'weekly'
    # Tooling that has to move in lockstep across workspace packages is grouped
    # into one PR — per-package bumps of biome or prisma produce PRs that
    # cannot be merged on their own.
    groups:
      biome:
        patterns:
          - '@biomejs/biome'
      prisma:
        patterns:
          - 'prisma'
          - '@prisma/*'
      trpc:
        patterns:
          - '@trpc/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
