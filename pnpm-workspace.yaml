packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions.
# Reference from any package.json as: "typescript": "catalog:"
catalog:
  # TS 7 = the native (Go) compiler. It ships no tsserver.js, so editors need
  # the TypeScript native extension — `typescript.tsdk` does not apply.
  typescript: ^7.0.2
  superjson: ^2.2.2

  # React — a second copy in the bundle breaks hooks
  react: ^19.2.0
  react-dom: ^19.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4

  # Type surfaces shared between api and web
  zod: ^4.3.6
  '@trpc/server': ^11.15.1
  better-auth: ^1.6.25

  # Prisma client and adapter must match the CLI in @ski-blazek/db
  '@prisma/client': ^7.10.0
  '@prisma/adapter-pg': ^7.10.0

  # Tooling
  tailwindcss: ^4.1.18

allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  core-js-pure: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - esbuild
  - prisma

minimumReleaseAgeExclude:
  - globals@17.9.0
